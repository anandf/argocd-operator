apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
  name: argocd-redis
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-redis
  template:
    metadata:
      annotations:
        argocds.argoproj.io/name: argocd
        argocds.argoproj.io/namespace: argocd
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/name: argocd
        app.kubernetes.io/part-of: argocd
    spec:
      containers:
      - args:
        - --save
        - ""
        - --appendonly
        - "no"
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin.password
              name: argocd-redis-initial-password
        image: public.ecr.aws/docker/library/redis:7.0.15-alpine
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts: null
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: argocd-redis
      volumes: null
